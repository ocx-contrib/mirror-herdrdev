extends: ../mirror-base.yml

name: herdr-core

# Logical index package `herdrdev/herdr-core` at the physical path
# `ghcr.io/ocx-contrib/herdrdev/herdr-core` — slash segments, never
# hyphen-flattened. Same namespace as the sibling `herdr` and `herdr-app`
# packages (see herdr/mirror.yml): `herdrdev` is the project's own brand org and
# holds this repo too (`gh api repos/herdrdev/herdr-core` → Apache-2.0,
# "herdr-core: terminals for coding agents").
target:
  registry: ghcr.io
  repository: ocx-contrib/herdrdev/herdr-core

# ─── Source: url_index, NOT github_release ──────────────────────────────────
#
# Same shape as herdr-app: NO GitHub Releases, only git tags.
#
#   $ gh api repos/herdrdev/herdr-core/releases --jq length   → 0
#   $ gh api repos/herdrdev/herdr-core/tags --jq '.[].name'   → v0.1.21 … v0.1.10
#
# Every version has an immutable `core/<version>/manifest.json` on
# releases.herdr.dev carrying each target's `url` + `sha256`; the generator
# lists the tags, fetches the manifest per tag and copies url + digest out of
# it. A tag whose manifest 404s is skipped; any other error fails. `command`
# resolves against THIS spec's directory.
source:
  type: url_index
  generator:
    command: ["uv", "run", "scripts/generate.py"]
    timeout_seconds: 240

# ⚠️ `verify` REPLACES the base's block outright (shallow `extends:` merge): the
# base's `github_asset_digest` is meaningless for a url_index source. The
# manifest declares a sha256 for every target, so require it.
verify:
  url_index_digest: require

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Measured on the real linux assets at BOTH ends of the declared range (0.1.10
# floor and 0.1.21 head), both arches — identical every time:
#
#   $ file herdr-core                      (x86_64)
#   ELF 64-bit LSB pie executable, x86-64, version 1 (SYSV), static-pie linked
#   $ file herdr-core                      (aarch64)
#   ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV), statically linked
#   $ readelf -l herdr-core | grep -c INTERP   → 0
#   $ readelf -d herdr-core | grep -c NEEDED   → 0
#   $ readelf -V herdr-core | grep -o 'GLIBC_[0-9.]*' | sort -uV   → (none)
#
# No PT_INTERP, no DT_NEEDED, no GLIBC_* symbol version, and upstream's
# release.yml builds `*-unknown-linux-musl` and asserts `file | grep static`.
# Nothing is required of the host userland, so both Linux keys are BARE. The
# ubuntu + alpine + fedora legs (restated below) turn that claim into evidence.
#
# ─── Asset scope (Phase 2, both directions) ────────────────────────────────
#
# The manifest of every version in range (0.1.10 … 0.1.21) names exactly five
# targets, one asset each, and each anchored regex matches EXACTLY ONE of them
# at every version (generator output checked 0.1.10–0.1.21). Nothing else is
# published: no checksums, signatures, source archives or installers.
#
#   herdr-core-linux-{x86_64,aarch64}.tar.gz
#   herdr-core-macos-{aarch64,x86_64}.tar.gz
#   herdr-core-windows-x86_64.zip
#
# macOS assets are per-arch (thin) builds, so each darwin key has its own
# pattern. `windows/arm64` is not published upstream — declaring it would match
# zero assets and be SILENTLY skipped.
assets:
  linux/amd64:
    - "^herdr-core-linux-x86_64\\.tar\\.gz$"
  linux/arm64:
    - "^herdr-core-linux-aarch64\\.tar\\.gz$"
  darwin/amd64:
    - "^herdr-core-macos-x86_64\\.tar\\.gz$"
  darwin/arm64:
    - "^herdr-core-macos-aarch64\\.tar\\.gz$"
  windows/amd64:
    - "^herdr-core-windows-x86_64\\.zip$"

# ⚠️ RESTATED IN FULL, not inherited. `extends:` is a SHALLOW merge, and
# ../mirror-base.yml's `platforms:` pins `windows/amd64` to `min_version:
# "0.8.2"` (the sibling `herdr` package had no Windows asset before that). That
# is a version of ANOTHER package: inherited here it would exclude every
# herdr-core version (0.1.x < 0.8.2) from Windows and the leg would silently
# self-skip forever. Everything else matches the base on purpose — same
# runners, same ubuntu + alpine + fedora container legs on both arches (aliased
# so the arches cannot drift), no `containers[].setup` because a static binary
# has nothing to provision. Windows has no `min_version`: all five targets exist
# from 0.1.3, below this spec's `versions.min`.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers: &linux_containers
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    runner: ubuntu-24.04-arm
    containers: *linux_containers
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.
  darwin/amd64:
    # Thin x86-64 Mach-O on an arm64 runner, under Rosetta 2 — never native
    # `macos-13` (see ../mirror-base.yml for the deadlock it causes). No
    # `prefix:`: the default applies only to `kind: command` tests and this
    # spec's only test is `kind: script`.
    runner: macos-15
  darwin/arm64:
    runner: macos-15
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh

asset_type:
  # Every archive has NO wrapper directory — entries sit at the archive root:
  #
  #   linux tar.gz:  herdr-core  LICENSE  THIRD-PARTY-NOTICES
  #   macos tar.gz:  herdr-core  LICENSE  THIRD-PARTY-NOTICES
  #                  Herdr Core.app/Contents/{MacOS/herdr-core, Info.plist, …}
  #                  (0.1.10 ships the bare `herdr-core` only)
  #   windows zip:   herdr-core.exe  conpty/{conpty.dll,x64/OpenConsole.exe}
  #                  LICENSE  THIRD-PARTY-NOTICES/…
  #
  # `strip_components: 0` — stripping one component would delete the
  # executable. It also keeps `conpty/` a sibling of `herdr-core.exe`, where it
  # looks for its ConPTY helper, and leaves PATH a bare ${installPath} on every
  # platform (hence one metadata.json). The macOS `Herdr Core.app` copy is
  # upstream's signed bundle, republished as-is.
  type: archive
  strip_components: 0

# `off`, for the same reason as the sibling `herdr`: the scan only looks BELOW
# an interface PATH entry of the form ${installPath}/<dir>, and here the
# executable IS the content root, so PATH is a bare ${installPath}. `auto` or
# `verify` is rejected at spec load (exit 65). `off` plus the hand-listed
# `binaries` in metadata.json is the blessed shape.
bin_scan: off

metadata:
  # Resolves against THIS spec's directory. One file for every platform.
  default: metadata.json

catalog:
  # logo.svg / logo.png / CATALOG.md sit beside this spec. Upstream herdr-core
  # ships no icon of its own (neither the repo nor the macOS bundle carries
  # one), so this is the herdr mark already used by the sibling `herdr`
  # package, unmodified.
  logo: logo.svg

versions:
  # 0.1.10 is the first tagged version — the tag list IS the version list.
  min: "0.1.10"
  new_per_run: 5
  # Hash-staggered, NOT hand-picked:
  #   $ python3 .claude/skills/create-mirror/scripts/poll_stagger.py herdrdev/herdr-core
  #   slot: 102  (minute=42, hour-offset=1)
  #   cron: 42 1-23/6 * * *
  poll_interval: "42 1-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT.
  - name: smoke
    script: herdr-core/tests/smoke.star

annotations:
  # $ gh api repos/herdrdev/herdr-core/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  package: herdrdev/herdr-core
  fork: ocx-contrib/index
